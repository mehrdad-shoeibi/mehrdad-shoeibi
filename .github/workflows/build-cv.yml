# Rebuilds the CV PDF whenever the LaTeX source under cv/ changes and commits it to assets/cv/.
# The profile README links to assets/cv/Mehrdad_Shoeibi_CV.pdf, so the download link always serves the latest build.
name: Build CV

on:
  push:
    branches: [main]
    paths:
      - "cv/**"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: cv
          root_file: Mehrdad_Shoeibi_CV.tex

      - name: Commit the PDF
        run: |
          mkdir -p assets/cv
          cp cv/Mehrdad_Shoeibi_CV.pdf assets/cv/Mehrdad_Shoeibi_CV.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cv/Mehrdad_Shoeibi_CV.pdf
          git diff --cached --quiet || git commit -m "Build CV PDF from cv/Mehrdad_Shoeibi_CV.tex"
          git push
